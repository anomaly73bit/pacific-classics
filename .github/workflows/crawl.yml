name: Crawl & publish

on:
  schedule:
    - cron: "17 4,11,17 * * *"  # 3 times a day: 04:17, 11:17, 17:17 UTC (06:17, 13:17, 19:17 Prague summer time)
  workflow_dispatch:
    inputs:
      models:
        description: "Only models whose id contains these words (space separated, empty = all)"
        required: false
      sources:
        description: "Only these sources (autoscout24 sauto willhaben kleinanzeigen mobilede; empty = all)"
        required: false
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: crawl
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-argos
          key: argos-models-v1
      - name: Crawl
        env:
          MOBILEDE_API_USER: ${{ secrets.MOBILEDE_API_USER }}
          MOBILEDE_API_PASSWORD: ${{ secrets.MOBILEDE_API_PASSWORD }}
        run: |
          ARGS=""
          [ -n "${{ inputs.models }}" ] && ARGS="$ARGS --models ${{ inputs.models }}"
          [ -n "${{ inputs.sources }}" ] && ARGS="$ARGS --sources ${{ inputs.sources }}"
          python -m pacific_classics crawl $ARGS
      - name: Commit data
        run: |
          git config user.name "pacific-classics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data data
          git diff --cached --quiet || git commit -m "data: crawl $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [crawl, deploy-only]
    if: always() && (needs.crawl.result == 'success' || needs['deploy-only'].result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
