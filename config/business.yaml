# Pacific Classics — pricing shown to customers
# Customer price = car price + Pacific Classics fee, rounded up to `round_to`.
# Fee = max(minimum_fee, car price × rate of its band). A customer price is never lower than the
# customer price of the most expensive car in the band below (no cheaper car just over a threshold).
minimum_fee: 400
round_to: 50
papers_fee: 350          # deregistration + export papers, always added on top (not inside the car price)
tiers:                   # [up to this car price (EUR), markup]
  - [500, 0.35]
  - [1600, 0.30]
  - [3000, 0.25]
  - [5000, 0.20]
  - [8000, 0.16]
  - [12000, 0.13]
  - [18000, 0.11]
  - [25000, 0.09]
  - [40000, 0.07]
  - [null, 0.05]         # above 40,000
